<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Pride_ad - Epitech, Cloud and AI, aspiring polymath">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.5" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="900" height="240" rx="12" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="30" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="205" r="1.2"><animate attributeName="opacity" values="1;0.15;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="40" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="190" r="1.1"><animate attributeName="opacity" values="1;0.1;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="25" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="4.5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="215" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="70" r="1.0"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="180" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="35" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="2.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="40" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="200" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="4.2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="140" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="215" r="1.3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- black hole -->
  <g transform="translate(720 120)">
    <circle r="115" fill="url(#glow)"/>
    <ellipse rx="88" ry="22" fill="none" stroke="url(#disk)" stroke-width="6" stroke-dasharray="34 12" opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="0" to="-92" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="62" ry="15" fill="none" stroke="url(#disk)" stroke-width="4" stroke-dasharray="18 10" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="0" to="56" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="27" fill="#000" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
    <!-- orbiting planet -->
    <circle r="5" fill="#58a6ff">
      <animateMotion dur="7s" repeatCount="indefinite" path="M -125 0 A 125 40 0 1 1 125 0 A 125 40 0 1 1 -125 0"/>
    </circle>
  </g>

  <!-- text -->
  <text x="48" y="112" font-family="Courier New, monospace" font-size="54" font-weight="bold" fill="#e6edf3" opacity="0">
    Pride_ad
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
  </text>
  <text x="50" y="152" font-family="Courier New, monospace" font-size="18" fill="#58a6ff" opacity="0">
    Epitech · Cloud &amp; AI · Aspiring polymath
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" begin="0.8s" fill="freeze"/>
  </text>
</svg>
